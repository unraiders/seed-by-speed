name: Docker Tag, Build and Push to DockerHub

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      description:
        description: 'Release tag, build and push'
        required: false
        default: ''

jobs:
  create-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from Dockerfile
        id: get_version
        run: |
          VERSION=$(grep "ARG VERSION=" Dockerfile | cut -d= -f2)
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check if tag already exists
        id: check_tag
        run: |
          VERSION=${{ steps.get_version.outputs.version }}
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null 2>&1; then
            echo "exists=true" >> $GITHUB_OUTPUT
            echo "::notice::El tag v$VERSION ya existe, se omite la publicación. Sube la versión en el Dockerfile para publicar una nueva release."
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Get Release Description
        id: get_release_notes
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          RELEASE_NOTES=$(cat RELEASE.md)
          echo "release_notes<<EOF" >> $GITHUB_OUTPUT
          echo "$RELEASE_NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create Tag
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git tag v${{ steps.get_version.outputs.version }}
          git push origin v${{ steps.get_version.outputs.version }}

      - name: Create Release
        if: steps.check_tag.outputs.exists == 'false'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.version }}
          name: v${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_release_notes.outputs.release_notes }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Login to Docker Hub
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/setup-buildx-action@v3

      - name: Check version format (only publish the latest if the release is semantic x.x.x)
        id: check_version
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          if [[ ${{ steps.get_version.outputs.version }} =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_semantic=true" >> $GITHUB_OUTPUT
          else
            echo "is_semantic=false" >> $GITHUB_OUTPUT
          fi

      - name: Build and push
        if: steps.check_tag.outputs.exists == 'false'
        uses: docker/build-push-action@v5
        with:
          context: .
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7
          push: true
          build-args: |
              VERSION=${{ steps.get_version.outputs.version }}
          tags: |
              unraiders/seed-by-speed:${{ steps.get_version.outputs.version }}
              ${{ steps.check_version.outputs.is_semantic == 'true' && 'unraiders/seed-by-speed:latest' || '' }}
